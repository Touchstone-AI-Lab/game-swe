[project]
name = "rhenium-container"
version = "0.1.0"
description = "Public container image provider for Rhenium runtimes that need no licence"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0"]

[project.entry-points."rhenium.auth_providers"]
container = "rhenium_container.provider:ContainerImageProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_container"]

[tool.uv.sources]
rhenium = { workspace = true }
