[project]
name = "rhenium-steam"
version = "0.1.0"
description = "Steam authentication and licensed depot provider for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0"]

[project.entry-points."rhenium.auth_providers"]
steam = "rhenium_steam.provider:SteamAuthProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_steam"]

[tool.uv.sources]
rhenium = { workspace = true }
