[model]
base_url = "https://api.together.ai/v1"
api_key = "replace-me"
# Optional second credential used only by the independent review stage.
# It shares this endpoint, protocol, model, and generation settings.
# review_api_key = "replace-me-review"
model = "red-lobster-7636/ds-test2"
# Use "anthropic" for an Anthropic Messages-compatible endpoint; base_url may
# be its root URL or end in /v1. api_key is sent as a Bearer auth token.
protocol = "openai"
# Keep TLS verification enabled. Set false only for an explicitly trusted test endpoint.
verify_tls = true
# Only sent with protocol = "openai". The value goes to the endpoint verbatim;
# if it rejects "max", `rhenium-author model-check` surfaces the HTTP 400.
reasoning_effort = "max"
# A thinking model bills its reasoning tokens from this same budget before the
# final answer starts, so keep this large or the JSON answer gets truncated.
max_tokens = 65536
# Read timeout for one response, in seconds (default 600). Raise it for slow
# reasoning endpoints whose large structured answers take longer than that.
# timeout_seconds = 1800

# Optional, but authenticated GitHub requests have a much higher rate limit.
# [github]
# token = "replace-me"

[curseforge]
api_key = "replace-me"
