[project]
name = "rhenium-authoring"
version = "0.1.0"
description = "Clean-room SWE-like benchmark authoring pipeline for Rhenium"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.11.7",
  "rhenium==0.6.0",
  "typer>=0.16.0",
]

[project.scripts]
rhenium-author = "rhenium_authoring.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_authoring"]

[tool.uv.sources]
rhenium = { workspace = true }
