<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Project-local Together / Kimi configuration example</title>
  <desc id="desc">Illustration only, with placeholder keys. Save base_url, model, api_key, optional review_api_key, and protocol in .rhenium/authoring-secrets.toml with permissions 0600. This file is ignored by Git.</desc>
  <rect width="800" height="460" rx="20" fill="#f5f5f4"/>
  <rect x="20" y="20" width="760" height="420" rx="14" fill="#ffffff" stroke="#d6d3d1"/>
  <path d="M20 82H780" stroke="#e7e5e4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="59" font-size="21" font-weight="600" fill="#292524">.rhenium/authoring-secrets.toml</text>
    <rect x="647" y="37" width="107" height="28" rx="14" fill="#ede9fe"/>
    <text x="700" y="57" text-anchor="middle" font-size="15" font-weight="600" fill="#6d28d9">EXAMPLE</text>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="25">
    <text x="48" y="128" fill="#7c3aed">[kimi]</text>
    <text x="48" y="172"><tspan fill="#44403c">base_url = </tspan><tspan fill="#047857">"https://api.together.ai/v1"</tspan></text>
    <text x="48" y="216"><tspan fill="#44403c">model = </tspan><tspan fill="#047857">"YOUR_MODEL_ID"</tspan></text>
    <text x="48" y="260"><tspan fill="#44403c">api_key = </tspan><tspan fill="#047857">"YOUR_KEY"</tspan></text>
    <text x="48" y="304"><tspan fill="#44403c">review_api_key = </tspan><tspan fill="#047857">"SECOND_KEY"</tspan></text>
    <text x="48" y="348"><tspan fill="#44403c">protocol = </tspan><tspan fill="#047857">"openai"</tspan></text>
  </g>
  <path d="M48 375H752" stroke="#e7e5e4"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#57534e">
    <text x="48" y="411">Git-ignored · chmod 600</text>
    <text x="752" y="411" text-anchor="end">Second key is optional · No real keys shown</text>
  </g>
</svg>
