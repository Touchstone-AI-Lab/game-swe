[project]
name = "rhenium-stardew-valley"
version = "0.6.0"
description = "Stardew Valley benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0"]

[project.entry-points."rhenium.benchmarks"]
stardew-valley = "rhenium_stardew_valley.plugin:StardewValleyBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_stardew_valley"]

[tool.uv.sources]
rhenium = { workspace = true }
