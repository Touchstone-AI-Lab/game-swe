[project]
name = "rhenium-minecraft"
version = "0.6.0"
description = "Minecraft (Paper server plugin) benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0", "rhenium-official-download==0.1.0"]

[project.entry-points."rhenium.benchmarks"]
minecraft = "rhenium_minecraft.plugin:MinecraftBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_minecraft"]

[tool.uv.sources]
rhenium = { workspace = true }
rhenium-official-download = { workspace = true }
