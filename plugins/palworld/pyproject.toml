[project]
name = "rhenium-palworld"
version = "0.7.0"
description = "Palworld benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = [
  "lupa>=2.4",
  "rhenium==0.6.0",
  "tree-sitter>=0.24.0",
  "tree-sitter-lua>=0.2.0",
]

[project.entry-points."rhenium.benchmarks"]
palworld = "rhenium_palworld.plugin:PalworldBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_palworld"]

[tool.uv.sources]
rhenium = { workspace = true }
