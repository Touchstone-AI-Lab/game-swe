[project]
name = "rhenium-left-4-dead-2"
version = "0.6.0"
description = "Left 4 Dead 2 benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0"]

[project.entry-points."rhenium.benchmarks"]
left-4-dead-2 = "rhenium_left_4_dead_2.plugin:Left4Dead2BenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_left_4_dead_2"]

[tool.uv.sources]
rhenium = { workspace = true }
