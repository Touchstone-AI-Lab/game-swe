[project]
name = "rhenium-isaac-rebirth"
version = "0.6.0"
description = "The Binding of Isaac: Rebirth benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0"]

[project.entry-points."rhenium.benchmarks"]
isaac-rebirth = "rhenium_isaac_rebirth.plugin:IsaacRebirthBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_isaac_rebirth"]

[tool.uv.sources]
rhenium = { workspace = true }
