[project]
name = "rhenium-slay-the-spire"
version = "0.7.0"
description = "Slay the Spire (ModTheSpire loader) benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0", "rhenium-container==0.1.0"]

[project.entry-points."rhenium.benchmarks"]
slay-the-spire = "rhenium_slay_the_spire.plugin:SlayTheSpireBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_slay_the_spire"]

[tool.uv.sources]
rhenium = { workspace = true }
rhenium-container = { workspace = true }
