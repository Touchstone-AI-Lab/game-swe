[project]
name = "rhenium-terraria"
version = "0.7.0"
description = "Terraria/tModLoader benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0"]

[project.entry-points."rhenium.benchmarks"]
terraria = "rhenium_terraria.plugin:TerrariaBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_terraria"]

[tool.uv.sources]
rhenium = { workspace = true }
