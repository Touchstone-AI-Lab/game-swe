[project]
name = "rhenium-balatro-plugin"
version = "0.3.0"
description = "Balatro candidate-pack adapter for Rhenium; native execution requires operator review"
requires-python = ">=3.12"
maintainers = [{name = "Sangyu Pan"}]
dependencies = ["rhenium==0.6.0"]

[project.entry-points."rhenium.benchmarks"]
balatro = "rhenium_balatro.plugin:BalatroBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_balatro"]

[tool.uv.sources]
rhenium = {workspace = true}
