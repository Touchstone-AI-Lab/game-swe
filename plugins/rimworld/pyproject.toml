[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhenium-rimworld"
version = "0.6.0"
description = "RimWorld benchmark plugin for Rhenium"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["rhenium==0.6.0"]

[tool.uv.sources]
rhenium = {workspace = true}

[project.entry-points."rhenium.benchmarks"]
rimworld = "rhenium_rimworld.plugin:RimWorldBenchmarkPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_rimworld"]
