[project]
name = "rhenium-mindustry"
version = "0.6.0"
description = "Mindustry benchmark plugin for Rhenium"
requires-python = ">=3.12"
dependencies = ["rhenium==0.6.0", "rhenium-official-download==0.1.0"]

[project.entry-points."rhenium.benchmarks"]
mindustry = "rhenium_mindustry.plugin:MindustryBenchmarkPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhenium_mindustry"]

[tool.uv.sources]
rhenium = { workspace = true }
rhenium-official-download = { workspace = true }
