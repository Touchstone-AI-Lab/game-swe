name: BlockTrail
version: 1.0.0
main: com.example.blocktrail.BlockTrailPlugin
api-version: '1.21'
description: Block change log with lookup and rollback
commands:
  trail:
    description: Look up, roll back and purge recorded block changes.
    usage: /trail <lookup|player|rollback|purge|reload>
permissions:
  blocktrail.lookup:
    description: Look up recorded changes by block or by actor.
    default: op
  blocktrail.rollback:
    description: Roll back an actor's changes.
    default: op
  blocktrail.admin:
    description: Purge old changes and reload the plugin.
    default: op
