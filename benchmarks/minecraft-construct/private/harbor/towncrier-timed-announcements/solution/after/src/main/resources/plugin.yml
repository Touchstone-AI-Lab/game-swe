name: TownCrier
version: 1.0.0
main: com.example.towncrier.TownCrierPlugin
api-version: '1.21'
description: Timed server announcements
commands:
  crier:
    description: Manage timed announcements.
    usage: /crier <list|now|pause|resume|add|remove|interval|preview|reload>
permissions:
  towncrier.admin:
    description: Use every /crier subcommand.
    default: op
  towncrier.staff:
    description: Receive announcements of groups restricted to staff.
    default: op
