schema_version = "1.4"

artifacts = ["/app/exodus"]

[task]
name = "gamecodebench/isaac-exodus-room-floor-state"
version = "2.0.0"
description = "Seven state and timing reports spanning item swaps, room entry, floor entry, room geometry, first-visit cache rewards, character-specific setup, and extreme-fire-rate cadence. Each behavior uses a different ownership or transition boundary. Version 2.0.0 adds three supplementary regressions (EX-441, EX-463, EX-412)."
authors = []
keywords = ["the-binding-of-isaac", "afterbirth-plus", "lua", "modding", "regression"]

[metadata]
category = "programming"
difficulty = "hard"
tags = ["game-modding", "lua", "isaac", "afterbirth-plus", "bug-fix"]
source_repo = "https://github.com/EchoGekko/Exodus"
source_license = "MIT"
base_commit = "7f88cea2d9549128679017dc1fca438efd044b90"
# Starter = the fully fixed Exodus tree of isaac-exodus-release-regressions with only these
# upstream fixes reverted; every other fix from that composite is present in the starter.
# Version 2.0.0 also applies the supplementary regressions named in reports (EX-4xx,
# private/supplementary-regressions/); gold.patch repairs them as well.
reports = "EX-318,EX-311,EX-251,EX-239,EX-266,EX-296,EX-203,EX-441,EX-463,EX-412"
reverted_fixes = "78800008,406a853,6da5cbf,a2de722,0dfd838,f1146fd,07b50ff1"
gold_patch_origin = "subset-of-composite-gold"
game = "The Binding of Isaac: Rebirth with Afterbirth and Afterbirth+"
game_build = "Afterbirth+ v1.06.T1; Steam App 250900 build 22878971"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 600.0
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
docker_image = "gcb-isaac-exodus-verifier:abp-v1.06.t1"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []

[agent]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
timeout_sec = 7200.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []

