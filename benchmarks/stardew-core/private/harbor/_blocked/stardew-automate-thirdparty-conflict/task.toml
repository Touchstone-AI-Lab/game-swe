schema_version = "1.1"

[task]
name = "gamecodebench/stardew-automate-thirdparty-conflict"
description = "A third-party mod shipped as a compiled assembly throws from a game method Automate calls during its location scan, stopping all automation. Automate must isolate per-entity failures so unaffected machines keep working."
authors = ["Jiaxuan Luo"]
keywords = ["stardew-valley", "smapi", "csharp", "game-modding", "composite", "symptom-only"]

[metadata]
category = "programming"
difficulty = "hard"
tags = ["game-modding", "smapi", "stardew-valley", "csharp", "bug-fix", "composite"]
source_repo = "https://github.com/Pathoschild/StardewMods"
source_license = "MIT"
source_mod = "Automate"
base_ref = "automate/2.6.1 with upstream fixes 0554cd80, e501b71b, f1a3b840, 19b32715 reverted"
fix_commit = "0554cd80+e501b71b+f1a3b840+19b32715 + engineered location-key pair; d336d22a reverted as unasserted haystack"
task_kind = "composite-symptom-only"
game_version = "1.6.15"
smapi_version = "4.1.10"

# Composite construction, mirroring darkrp-release-regressions: the base tree is
# the latest release with a batch of real upstream fixes reverted; the reference
# solution restores them. Each defect group is independently observable in-game
# and its symptom report describes user-visible behavior only.

[verifier]
network_mode = "no-network"
timeout_sec = 2400.0

[agent]
# mini-swe-agent runs INSIDE the container and calls the model API from there, so a
# blanket no-network kills it before it does any work. Everything else it needs is
# baked into the image; github.com / nuget.org are deliberately NOT listed because
# the reference fixes are upstream commits.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
timeout_sec = 7200.0

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 6
memory_mb = 16384
storage_mb = 30720
gpus = 0
mcp_servers = []

# Same isolation and responsible-release posture as the rest of the Stardew suite:
# game files staged locally from the operator's own copy, never committed; images
# stay private; pretraining contamination is not addressed by isolation.

# MOD-CONFLICT DESIGN — the one task whose answer is not fully recoverable from the
# mod repository. The levers tried before it were defect count, subtlety, novelty,
# decoys, multi-step state, and per-group difficulty. The untested structural
# hypothesis is that difficulty comes from information living OUTSIDE the repo.
#
# The environment ships a second mod, "Smart Machines" (thirdparty.SmartMachines),
# built from source at image build time; the source is then DELETED, so the final
# image carries only the assembly — the agent sees exactly what a player sees. It
# Harmony-postfixes Object.GetMachineData and throws for kegs, i.e. a plausible
# third-party integration bug.
#
# The defect under test is Automate's own lack of isolation: the exception escapes
# the location scan, so no machine in that location is automated. This is a
# robustness contract rather than a reverted upstream fix, so the instruction states
# it explicitly ("a failure originating in another mod must not stop Automate from
# automating the rest of a location") — an author-invented contract must be stated,
# per the DarkRP suite's API-addition rule.
#
# FAIRNESS: the suite asserts only about the BYSTANDER machines (a chest and furnace
# that the other mod never touches). It never asserts anything about the keg, how the
# error is logged, or where the isolation is placed, so any correct isolation
# strategy passes.
