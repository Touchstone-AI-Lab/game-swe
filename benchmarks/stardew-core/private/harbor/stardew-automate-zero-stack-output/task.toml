schema_version = "1.1"

[task]
name = "gamecodebench/stardew-automate-zero-stack-output"
description = "Fix Automate wedging machines forever when another mod's broken machine logic produces a zero-size output stack; the broken output must be discarded like the vanilla manual-emptying path."
authors = ["Jiaxuan Luo"]
keywords = ["stardew-valley", "smapi", "csharp", "game-modding", "mod-conflict"]

[metadata]
category = "programming"
difficulty = "medium"
tags = ["game-modding", "smapi", "stardew-valley", "csharp", "bug-fix"]
source_repo = "https://github.com/Pathoschild/StardewMods"
source_license = "MIT"
source_mod = "Automate"
base_ref = "automate/2.3.1"
fix_commit = "19b32715"
fixed_release = "automate/2.3.2"
game_version = "1.6.15"
smapi_version = "4.1.10"

[verifier]
network_mode = "no-network"
timeout_sec = 1800.0

[agent]
# mini-swe-agent runs INSIDE the container and calls the model API from there, so a
# blanket no-network kills it before it does any work. Everything else it needs is
# baked into the image; github.com / nuget.org are deliberately NOT listed because
# the reference fix is an upstream commit.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 6
memory_mb = 16384
storage_mb = 30720
gpus = 0
mcp_servers = []

# Same isolation and responsible-release posture as the rest of the Stardew suite:
# game files staged locally from the operator's own copy, never committed; images
# stay private; pretraining contamination is not addressed by isolation.
