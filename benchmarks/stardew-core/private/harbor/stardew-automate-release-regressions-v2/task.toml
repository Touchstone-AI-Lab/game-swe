schema_version = "1.1"

[task]
name = "gamecodebench/stardew-automate-release-regressions-v2"
description = "Six defect groups in one Automate tree, reported as ~8 user symptoms with no count given: four reverted upstream fixes, an engineered self-consistent location-key mutation pair that only bites with duplicate building types, and an unasserted haystack revert."
authors = ["Jiaxuan Luo"]
keywords = ["stardew-valley", "smapi", "csharp", "game-modding", "composite", "symptom-only"]

[metadata]
category = "programming"
difficulty = "hard"
tags = ["game-modding", "smapi", "stardew-valley", "csharp", "bug-fix", "composite"]
source_repo = "https://github.com/Pathoschild/StardewMods"
source_license = "MIT"
source_mod = "Automate"
base_ref = "automate/2.6.1 with upstream fixes 0554cd80, e501b71b, f1a3b840, 19b32715 reverted"
fix_commit = "0554cd80+e501b71b+f1a3b840+19b32715 + engineered location-key pair; d336d22a reverted as unasserted haystack"
task_kind = "composite-symptom-only"
game_version = "1.6.15"
smapi_version = "4.1.10"

# Composite construction, mirroring darkrp-release-regressions: the base tree is
# the latest release with a batch of real upstream fixes reverted; the reference
# solution restores them. Each defect group is independently observable in-game
# and its symptom report describes user-visible behavior only.

[verifier]
network_mode = "no-network"
timeout_sec = 2400.0

[agent]
# mini-swe-agent runs INSIDE the container and calls the model API from there, so a
# blanket no-network kills it before it does any work. Everything else it needs is
# baked into the image; github.com / nuget.org are deliberately NOT listed because
# the reference fixes are upstream commits.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
timeout_sec = 7200.0

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 6
memory_mb = 16384
storage_mb = 30720
gpus = 0
mcp_servers = []

# Same isolation and responsible-release posture as the rest of the Stardew suite:
# game files staged locally from the operator's own copy, never committed; images
# stay private; pretraining contamination is not addressed by isolation.

# V2 DESIGN (following darkrp-release-regressions-v3's blueprint):
# - The instruction does NOT state how many defects there are; reports #221/#222
#   share one root cause, and #224 maps to the unasserted haystack below.
# - Group E is an engineered strongly-subsuming higher-order mutant (SSHOM):
#   MachineGroupFactory.GetLocationKey drops the unique name AND
#   GameLocationNameComparer compares bare Name. The pair is self-consistent —
#   every single-instance location works, so the tree looks healthy — and only
#   duplicate building interiors (two coops) collide. Fixing either half alone
#   still fails the twin-coop group. Validated against four trees:
#     base (both mutations)      -> twin-coop group fails
#     reference (both fixed)     -> 14/14
#     half-fix, key builder only -> twin-coop group fails
#     half-fix, comparer only    -> twin-coop group fails
# - Haystack: the upstream incubator guards (d336d22a) are also reverted and
#   reported (#224) but carry NO assertion — the bug is real and the gold patch
#   restores the guards, but its observable needs a real overnight
#   (OnlyCompleteOvernight), unreachable in one boot; see
#   _blocked/stardew-automate-incubator-egg-theft for the probe evidence.
