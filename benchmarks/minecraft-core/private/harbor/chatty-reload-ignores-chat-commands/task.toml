base_commit = "c632a311cd8db35a1a3d39546a154d7c9091b331"
source_license = "MIT"
expected_unit_cases = 161
expected_server_cases = 7
content_reference = "benchmarks/minecraft-core/exams/chatty-reload-ignores-chat-commands.md"
content_reference_pack = "rhenium-minecraft-v1"
