schema_version = "1.4"

artifacts = ["/app/plugin"]

[task]
name = "gamecodebench/minecraft-chatty-reload-ignores-chat-commands"
version = "1.0.0"
description = "Repair Chatty so /chatty reload registers chat commands added to chats.yml and unregisters the old name of a renamed command and the command of a removed chat, instead of requiring a server restart."
authors = [{ name = "GameCodeBench" }]
keywords = ["minecraft", "paper", "java", "game-modding", "repository-debugging", "configuration", "command-registration", "plugin-lifecycle", "reload"]

