schema_version = "1.4"

artifacts = ["/app/plugin"]

[task]
name = "gamecodebench/minecraft-prometheus-exporter-players-total-main-thread"
version = "1.0.0"
description = "Repair minecraft-prometheus-exporter so the players_total metric is collected on the scrape's own thread instead of being dispatched to the server's main thread."
authors = [{ name = "GameCodeBench" }]
keywords = ["minecraft", "paper", "java", "game-modding", "repository-debugging", "metrics", "threading", "scheduler"]

[metadata]
category = "programming"
difficulty = "easy"
tags = ["game-modding", "minecraft", "java", "repository-debugging"]
task_kind = "repository-debugging"
game = "Minecraft (Paper dedicated server)"
game_version = "Paper 1.21.11 build 132"
language = "Java 21"
build_tool = "maven"
plugin_name = "PrometheusExporter"
source_repo = "https://github.com/sladkoff/minecraft-prometheus-exporter"
base_commit = "e8647672998b36279970ea07c68e97a1af7daee3"
source_license = "MIT"
expected_unit_cases = 27
expected_server_cases = 7
content_reference = "benchmarks/minecraft-core/exams/prometheus-exporter-players-total-main-thread.md"
content_reference_pack = "rhenium-minecraft-v1"
harbor_reference_repository = "https://github.com/harbor-framework/harbor"
harbor_reference_revision = "9a2e3b135cc8fb1e41131020f83370cb2f12ae93"
verification_profile = "rhenium-minecraft-full"
