schema_version = "1.4"

artifacts = ["/app/plugin"]

[task]
name = "gamecodebench/minecraft-chatty-failed-migration-dead-plugin"
version = "1.0.0"
description = "Repair Chatty so that a legacy v2 configuration whose migration fails no longer leaves an enabled plugin that handles nothing: quarantine the half-migrated files, tell the operator, start with a default configuration that /chatty reload can use, and migrate caps limits into the range v3 accepts."
authors = [{ name = "GameCodeBench" }]
keywords = ["minecraft", "paper", "java", "game-modding", "repository-debugging", "configuration", "migration", "plugin-lifecycle", "error-handling"]

