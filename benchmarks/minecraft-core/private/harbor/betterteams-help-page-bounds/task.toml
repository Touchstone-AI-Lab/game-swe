plugin_name = "BetterTeams"
source_repo = "https://github.com/booksaw/BetterTeams"
base_commit = "96e725761ea668082e9d8cd6eb3b2bf9fbe3d437"
source_license = "MIT"
expected_unit_cases = 44
expected_server_cases = 10
content_reference = "benchmarks/minecraft-core/exams/betterteams-help-page-bounds.md"
content_reference_pack = "rhenium-minecraft-v1"
harbor_reference_repository = "https://github.com/harbor-framework/harbor"
