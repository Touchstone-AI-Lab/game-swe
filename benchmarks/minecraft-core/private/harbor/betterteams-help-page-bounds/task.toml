schema_version = "1.4"

artifacts = ["/app/plugin"]

[task]
name = "gamecodebench/minecraft-betterteams-help-page-bounds"
version = "1.0.0"
description = "Repair BetterTeams so out-of-range help pages clamp to a real page and every prefixed plugin line, from help entries to chest-claim broadcasts, carries the configured prefix instead of null."
authors = [{ name = "GameCodeBench" }]
keywords = ["minecraft", "paper", "java", "game-modding", "repository-debugging", "commands", "pagination", "messaging"]

[metadata]
category = "programming"
