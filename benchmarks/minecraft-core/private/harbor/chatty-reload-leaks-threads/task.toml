schema_version = "1.4"

artifacts = ["/app/plugin"]

[task]
name = "gamecodebench/minecraft-chatty-reload-leaks-threads"
version = "1.0.0"
description = "Repair Chatty so /chatty reload releases the resources the previous configuration owned: the replaced notification ticker's executor thread, the previous bStats submitter (also when metrics are switched off) and the Redisson client no longer pile up with every reload, and cancelling a ticker that never started no longer throws."
authors = [{ name = "GameCodeBench" }]
keywords = ["minecraft", "paper", "java", "game-modding", "repository-debugging", "plugin-lifecycle", "concurrency", "resource-management", "dependency-injection"]

[metadata]
category = "programming"
difficulty = "medium"
tags = ["game-modding", "minecraft", "java", "repository-debugging"]
task_kind = "repository-debugging"
game = "Minecraft (Paper dedicated server)"
game_version = "Paper 1.21.11 build 132"
language = "Java 21"
build_tool = "gradle"
plugin_name = "Chatty"
source_repo = "https://github.com/Brikster/Chatty"
base_commit = "f98b81914293a3d48bb1b759e6c9e7d937164d4e"
source_license = "MIT"
expected_unit_cases = 82
expected_server_cases = 8
content_reference = "benchmarks/minecraft-core/exams/chatty-reload-leaks-threads.md"
content_reference_pack = "rhenium-minecraft-v1"
harbor_reference_repository = "https://github.com/harbor-framework/harbor"
harbor_reference_revision = "9a2e3b135cc8fb1e41131020f83370cb2f12ae93"
verification_profile = "rhenium-minecraft-full"
real_server_validation = "in-verifier; Paper 1.21.11 build 132"

[verifier]
