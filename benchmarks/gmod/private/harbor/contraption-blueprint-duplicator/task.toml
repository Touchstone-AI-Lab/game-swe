schema_version = "1.4"

artifacts = ["/app/addon"]

[task]
name = "gamecodebench/gmod-contraption-blueprint-duplicator"
version = "1.0.0"
description = "Build a contraption blueprint duplicator that canonicalizes, persists, and restores an entity and constraint graph with rollback and Undo."
authors = [{ name = "Changyi" }, { name = "Yunta Hsieh" }]
keywords = ["garrys-mod", "gmod", "glua", "lua", "game-modding", "generation", "graph-serialization", "constraints", "persistence", "rollback"]

[metadata]
category = "programming"
difficulty = "expert"
tags = ["game-modding", "garrys-mod", "lua", "generation", "composite"]
task_kind = "generation-composite"
game = "Garry's Mod Dedicated Server"
mod_loader = "Garry's Mod Addon (Sandbox, gm_flatgrass)"
language = "GLua restricted to the Lua 5.1 compatible subset"
content_reference = "benchmarks/gmod/exams/contraption-blueprint-duplicator.md"
content_reference_pack = "rhenium-gmod-v2"
content_reference_task_version = "2.2.0"
harbor_reference_repository = "https://github.com/harbor-framework/harbor"
harbor_reference_revision = "9a2e3b135cc8fb1e41131020f83370cb2f12ae93"
verification_profile = "rhenium-garrys-mod-addons-full"
real_server_validation = "in-verifier; Steam app 4020 Linux build 23150012"

[verifier]
network_mode = "no-network"
timeout_sec = 1080.0
user = "root"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
# The image already contains Codex CLI and mini-swe-agent. A Harbor job supplies
# only the model endpoint hostname through agents[].extra_allowed_hosts.
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 25200.0
user = "agent"

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
