tags = ["mindustry", "java", "repository-debugging"]
task_kind = "repository-debugging"
game = "Mindustry (dedicated server)"
game_version = "Mindustry v159.7"
language = "Java 17"
build_tool = "mindustry-source"
source_repo = "https://github.com/Anuken/Mindustry"
source_release = "v159.7"
base_commit = "c9686eb5d0ae5dd47ee02c40f99f7d5018ccbc8c"
