[task]
name = "gamecodebench/dst-dsmmo-release-regressions"
version = "2.0.0"
description = "Repair the DsMMO server mod so its skill handlers stop raising Lua errors for damage without an attacker, self-inflicted damage, non-combat targets, empty haunts and tool-less digging, saves from another Exp-gain setting are recalculated, and an incomplete eat command is handled."
